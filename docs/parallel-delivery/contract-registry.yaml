schema_version: "1.0.0"
kind: parallel_delivery_contract_registry
status: proposed_experiment_no_new_implementation_authority
as_of: "2026-09-28"
authority_refs:
  - docs/09-contracts/README.md
  - docs/09-contracts/00-common-contract.md
  - docs/09-contracts/13-traceability-and-open-items.md

version_policy:
  authority: CT-CMN-012
  compatible_change:
    - additive_optional_field_when_all_consumers_ignore_unknown_fields
    - additive_open_enum_value_when_all_consumers_ignore_unknown_values
  breaking_change:
    - remove_field
    - redefine_field
    - change_unit
    - change_cardinality
    - tighten_input_condition
  breaking_action: increment_major_version
  in_flight_rule: producer_supports_compatibility_window_until_workflows_complete_or_migrate
  history_rule: do_not_rewrite_old_schema_or_accepted_evidence
  consumer_rule: fail_closed_on_unsupported_version
  freeze_rule: exact_revision_must_be_frozen_before_dependent_task_becomes_ready

schema:
  required_fields:
    - id
    - source
    - owner
    - consumers
    - kind
    - current_revision
    - source_sha256
    - lifecycle
    - compatibility_window
    - lock
  lifecycle_enum:
    - design_baseline
    - active_accepted
    - proposed
    - deprecated
  kind_enum:
    - common
    - synchronous_command_query
    - domain_event
    - workflow_activity
    - artifact_reference
    - state_machine

