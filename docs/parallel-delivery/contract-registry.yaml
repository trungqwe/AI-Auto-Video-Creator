batches_query_contract:
  id: CONTRACT-BATCHES-QUERY
  contract_ids:
    - CT-BAT-001
    - CT-BAT-002
    - CT-BAT-003
    - CT-BAT-004
  defining_source: docs/09-contracts/01-control-api-and-stream.md
  owner: H
  co_owners: [G]
  consumers: [H, G]
  kind: synchronous_command_query
  endpoints:
    list_batches:
      id: CT-BAT-001
      method: GET
      path: /api/v1/batches
      query_params: [status, limit, offset, sort_by, order]
      description: Tra cứu danh sách batch kèm phân trang và lọc theo trạng thái
      response:
        batches: list_of_batch_summary
        total_count: integer
        page_info: {limit: integer, offset: integer, has_more: boolean}
    batch_detail:
      id: CT-BAT-002
      method: GET
      path: /api/v1/batches/{batch_id}
      description: Chi tiết batch, tiến độ từng job và trạng thái thực thi thực tế
      response:
        batch_id: string_uuid
        status: string_enum
        created_at: timestamp_rfc3339
        jobs_summary: {total: integer, pending: integer, running: integer, succeeded: integer, failed: integer}
        capacity_reservation: {total_slots: integer, allocated_slots: list_of_integers}
    filter_batches:
      id: CT-BAT-003
      description: Bộ lọc nâng cao cho danh sách batch
      supported_filters: [date_range, status_in, priority_min, has_errors]
    paginate_batches:
      id: CT-BAT-004
      description: Quy chuẩn phân trang offset/limit cho batch query
      type: offset_limit
      max_limit: 100
      default_limit: 20

operation_execution_state_model:
  receipt_vs_authoritative_state:
    receipt_state:
      value: accepted
      semantics: Command đã được Control API xác thực cú pháp và ghi nhận vào transactional outbox
      is_terminal: false
      authority: ControlAPI
    authoritative_execution_states:
      running:
        semantics: Workflow engine hoặc worker đã nhận lease và đang thực thi các stage nghiệp vụ
        is_terminal: false
      succeeded:
        semantics: Toàn bộ workflow stages hoàn thành thành công; completion Unit of Work đã commit nguyên tử
        is_terminal: true
      failed:
        semantics: Workflow gặp lỗi không thể phục hồi hoặc vượt quá ngân sách retry
        is_terminal: true
      cancelled:
        semantics: Lệnh hủy của người dùng đã được xử lý; fencing token đã bị vô hiệu hóa
        is_terminal: true
  query_resolution_rule:
    rule: Mọi truy vấn trạng thái (Read queries) phải đọc trạng thái thực thi có thẩm quyền từ PostgreSQL Unit of Work / state store; tuyệt đối không suy đoán trạng thái từ receipt accepted hoặc từ một stream event bất kỳ.

key_interface_boundaries:
  interface_a_b:
    name: DocumentPackage
    producer: A
    consumer: B
    contract_id: CONTRACT-SOURCE-CONTENT
    description: Gói tài liệu thu thập từ nguồn tin chuyển giao sang module bài viết
    schema:
      source_id: string_uuid
      document_id: string_uuid
      raw_payload: string_json_or_text
      metadata: {title: string, author: string, published_at: timestamp_rfc3339, url: string}
      collection_run_id: string_uuid
      provenance_hash: string_sha256
  interface_b_d:
    name: ArticleSnapshot
    producer: B
    consumer: D
    contract_id: CONTRACT-SOURCE-CONTENT
    description: Bản chụp bài viết đã chuẩn hóa và chống trùng phục vụ tạo kịch bản
    schema:
      article_id: string_uuid
      revision_id: string_uuid
      canonical_content: string_markdown
      extracted_entities: list_of_strings
      content_fingerprint: string_sha256
      event_id: string_uuid_optional
  interface_c_i:
    name: MetadataCatalog_vs_ArtifactByteIntegrity
    catalog_owner: C
    byte_integrity_owner: I
    contracts: [CONTRACT-CONTENT-MEDIA, CONTRACT-STORAGE]
    description: Tách biệt danh mục metadata và hook với kho lưu trữ byte vật lý và tính toàn vẹn
    boundary_rule: Module C sở hữu danh mục media, số lượt sử dụng, phân loại hook; Module I sở hữu lưu trữ byte vật lý, kiểm chứng mã băm SHA-256 và trạng thái đồng bộ Google Drive.
  interface_d_e_f:
    name: Script_Voice_Timing_Render_Package
    producer_script: D
    producer_voice: E
    consumer_render: F
    contracts: [CONTRACT-CREATIVE-AI, CONTRACT-MEDIA-PROCESSING, CONTRACT-RENDER-QUALITY]
    description: Chuỗi sản xuất kịch bản, lồng tiếng, khớp timing từng từ và render video hoàn chỉnh
    boundary_rule: D sinh kịch bản và visual cues; E tổng hợp giọng đọc TTS và timestamp từng từ cho karaoke; F kết hợp video 61-70s 1080p với karaoke subtitle và thumbnail trong hook.
  interface_g_c_i:
    name: CompletionUnitOfWork
    orchestrator: G
    media_usage: C
    artifact_ledger: I
    contracts: [CONTRACT-DOMAIN-EVENTS, CONTRACT-ORCHESTRATION, CONTRACT-STORAGE]
    description: Unit of Work nguyên tử hoàn tất video job, ghi nhận media usage và vị trí artifact
    boundary_rule: PostgreSQL Unit of Work phía caller điều phối nguyên tử việc hoàn thành VideoJob, cập nhật MediaUsage và ghi ArtifactLocation; cấm ghi trực tiếp vào bảng của aggregate khác.
  interface_j_provider:
    name: Configuration_SecretHandles_Routing_Quotas
    provider_owner: J
    consumers: [A, B, C, D, E, F, G, H, I]
    contract_id: CONTRACT-CONFIG-SECURITY
    description: Quản lý khóa API, cách ly secret cấp OS, điều phối route AI và hạn ngạch quota
    boundary_rule: Module J đóng gói toàn bộ khóa dịch vụ, định tuyến mô hình AI và hạn ngạch; các module khác chỉ tương tác thông qua secret handle và adapter typed.

change_protocol:
  steps:
    - owner_opens_revision_proposal
    - identify_producers_consumers_persisted_history_and_in_flight_workflows
    - classify_compatible_or_breaking_using_CT_CMN_012
    - add_producer_consumer_contract_tests_and_migration_or_dual_read_write_plan
    - observe_discriminating_red
    - freeze_exact_revision
    - replan_all_dependent_tasks
    - implement_producer_then_compatible_consumers
    - verify_compatibility_window
    - deprecate_only_after_no_references_remain
  prohibited:
    - concurrent_edit_of_same_contract_revision
    - consumer_guessing_unknown_schema
    - retroactive_edit_of_accepted_schema_or_evidence
    - contract_change_hidden_inside_consumer_task
