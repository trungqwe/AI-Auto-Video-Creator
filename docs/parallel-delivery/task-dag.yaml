  contract_refs:
  - id: CT-CMN-003
    registry: CONTRACT-COMMON
    revision: sha256:dfdce8db13d5f1d1f286ccd233a66caf39f48552da2dbbad26692fde7be978e8
  - id: CT-API-008
    registry: CONTRACT-CONTROL-API-STREAM
    revision: sha256:ea16fe04759e6bdf3b7bdde3e27ad498d13a271bd45d412ba0e9068a9b918e12
  invariant_refs:
  - INV-001
  - INV-002
  - INV-012
  - INV-016
  module_owners:
  - H
  owned_paths:
  - src/controlplane/ui/**
  - tests/m2/e2e/**
  - src/controlplane/application/test_driver.py
  forbidden_paths:
  - src/m1proof/**
  - tests/m1/**
  - src/ingestion/**
  - src/catalog/**
  - src/creative/**
  - src/voice/**
  - src/render/**
  - src/controlplane/api/main.py
  - docs/09-contracts/**
  - protected-checkouts/main/**
  - protected-checkouts/backup/**
  resource_locks:
  - LOCK-SRC-CONTROL-UI
  - LOCK-DEPENDENCY-UNIVERSE
  - LOCK-MIGRATION-SEQUENCE
  runtime_prerequisites:
  - node_22
  - npm_10
  - python
  - playwright
  acceptance:
  - requirement: React TypeScript AG Grid renders Operations, Batches and Jobs in Vietnamese from the real Control API.
    instrument: npm --prefix src/controlplane/ui run build
    counterexample: UI is absent, not UTF-8, or renders hard-coded fixture rows instead of API data.
    red_observation: P8 admin UI and API client are not implemented before the bounded task.
    limitations: This slice does not open Module A or production collection.
  - requirement: StartProductionBatch uses Idempotency-Key and renders a durable CommandReceipt without duplicate side effects.
    instrument: tests/m2/e2e/admin-command-idempotency.spec.ts
    counterexample: repeated command creates a second operation or receipt is not shown.
    red_observation: command form and receipt flow are absent before implementation.
    limitations: Test driver is test-only and cannot authorize production mutation.
  - requirement: SSE updates the real browser DOM through ACCEPTED to RUNNING to SUCCEEDED.
    instrument: tests/m2/e2e/operations-sse.spec.ts
    counterexample: browser requires refresh, loses cursor, or accepts a fabricated frontend event.
    red_observation: no real EventSource-to-AG-Grid flow exists before implementation.
    limitations: The driver advances only isolated test state.
  - requirement: Error modal is safe and XSS input is escaped without secrets or raw stack traces in DOM/logs.
    instrument: tests/m2/e2e/safe-error-modal.spec.ts
    counterexample: script executes or technical detail leaks into user-visible output.
    red_observation: safe error boundary and sanitization are absent before implementation.
    limitations: Secret scanner and full M2 exit audit remain P9.
  - requirement: UI responsiveness meets QR-PERF-005 and command acknowledgement meets QR-PERF-006.
    instrument: tests/m2/e2e/performance-budget.spec.ts
    counterexample: 95 percent of normal actions exceed two seconds or acknowledgement exceeds one second.
    red_observation: no measured browser performance evidence exists before implementation.
    limitations: Dataset scale remains outside this slice.
  evidence_outputs:
  - docs/milestones/m2-control-plane/evidence/m2-p8/**
  specFile: docs/milestones/m2-control-plane/implementation-plan.md
  rollback:
    strategy: revert_task_commit
    reference: docs/milestones/m2-control-plane/implementation-plan.md
    preserves_accepted_evidence: true
