    lock_ref: LOCK-CONTRACT-SOURCE
    rule: Only contract owner can update frozen contract revisions; breaking changes
      require major version bump.
  migration_ledger:
    path_pattern: src/**/migrations/**
    lock_ref: LOCK-MIGRATION-SEQUENCE
    rule: Strictly serialized global migration counter; no branch may create parallel
      migration numbers.
  dependency_universe:
    lock_ref: LOCK-DEPENDENCY-UNIVERSE
    files:
    - pyproject.toml
    - uv.lock
    - package-lock.json
    rule: Single toolchain owner per milestone; lockfile updates must be serialized.
  historical_evidence:
    lock_ref: LOCK-ACCEPTED-EVIDENCE
    path_pattern: docs/milestones/**/evidence/**
    rule: Immutable historical evidence; mutation leases strictly prohibited fail-closed.
