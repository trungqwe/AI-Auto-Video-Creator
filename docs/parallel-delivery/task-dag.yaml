    depends_on: []
    requirement_refs:
      - QR-MNT-002
      - QR-MNT-003
      - QR-COMP-003
    contract_refs:
      - id: CT-CMN-012
        registry: CONTRACT-COMMON
        revision: sha256:dfdce8db13d5f1d1f286ccd233a66caf39f48552da2dbbad26692fde7be978e8
      - id: CT-CMN-013
        registry: CONTRACT-COMMON
        revision: sha256:dfdce8db13d5f1d1f286ccd233a66caf39f48552da2dbbad26692fde7be978e8
    invariant_refs:
      - INV-002
      - INV-012
      - INV-016
    module_owners: []
    owned_paths:
      - AGENTS.md
      - CLAUDE.md
      - HANDOFF.md
      - README.md
      - CHANGELOG.md
      - docs/11-roadmap.md
      - docs/12-pre-code-checklist.md
      - docs/parallel-delivery/**
    forbidden_paths:
      - src/**
      - tests/**
      - "**/*.sql"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - docs/milestones/**/evidence/**
    resource_locks:
      - LOCK-DOC-AUTHORITY
      - LOCK-AGENT-CONFIG
      - LOCK-PARALLEL-REGISTRY
      - LOCK-DOC-INDEX
    runtime_prerequisites:
      - git
      - python_yaml_parser_or_equivalent
    acceptance:
      - requirement: UTF-8 text is valid without BOM and contains no mojibake/control characters.
        instrument: parse_utf8_and_scan_text
        counterexample: Files are present and parse as bytes, but Vietnamese text is double-encoded or a carriage return splits the review row.
        red_observation: inherited AGENTS.md exhibited double-encoded Vietnamese and a carriage-return-corrupted review cell before correction.
        limitations: Static scan cannot prove prose correctness.
      - requirement: DAG, registry, locks and trace references are structurally valid.
        instrument: parse_yaml_check_ids_dependencies_acyclic_and_references
        counterexample: YAML parses, but a dependency points to an unknown node or two active tasks own the same exclusive resource.
        red_observation: required machine registries were absent before this task.
        limitations: Static validation does not run an Orca pilot.
      - requirement: No new product implementation authority is created.
        instrument: authority_wording_and_changed_path_scan
        counterexample: Future template nodes exist and are incorrectly marked granted or a prohibited source path changes.
        red_observation: no machine architecture existed; authority invariant is checked by diff and registry state.
        limitations: Human review remains required for semantic ambiguity.
    evidence_outputs:
      - docs/parallel-delivery/.validation-report.json
    rollback:
      strategy: revert_task_commit_or_restore_verified_docs_only_backup
      reference: D:/AI_SETUP/backups/AI-Auto-Video-Creator/20260928-175542
      preserves_accepted_evidence: true
    route:
      control:
        model: cx/gpt-5.6-sol-high
      implement:
        harness: Codex CLI
        model: ag/gemini-3.8-flash-high
        effort: high
      review:
        harness: Claude Code
        model: cx/gpt-5.6-sol-high
        effort: high
      supreme_audit:
        model: cx/gpt-6-astra-medium
        effort: medium
        use: external_extremely_difficult_audit_only
    merge_priority: 10

