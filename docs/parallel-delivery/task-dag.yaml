- id: M2-P8
  milestone: M2
  kind: work_package_slice
  status: ready
  requireAstra: true
  authority:
    state: granted
    scope: control_plane_admin_ui_and_real_browser_e2e
    does_not_authorize_descendants: true
  authority_refs:
