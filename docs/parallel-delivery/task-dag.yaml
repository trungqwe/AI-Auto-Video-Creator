tasks:
  - id: PD-PILOT-CONTROL
    milestone: DELIVERY-ARCH-EXPERIMENT
    kind: documentation_configuration
    status: review
    authority:
      state: granted
      scope: docs_and_agent_configuration_only
      does_not_authorize_descendants: true
    authority_refs:
      - HANDOFF.md
      - docs/12-pre-code-checklist.md
