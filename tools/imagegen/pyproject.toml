# Môi trường riêng của sidecar sinh ảnh minh hoạ (IMGGEN-SVC): FLUX 3 Image Klein chạy cục bộ trên GPU.
# Nằm ngoài runtime khoá của sản phẩm và ngoài Runtime Keeper; dựng bằng
#   UV_PROJECT_ENVIRONMENT=<data>/imagegen/venv uv sync --frozen --project tools/imagegen
# Phiên bản ghim theo môi trường nguyên mẫu Control đã sinh ảnh thật ngày 02/11/2026 (D:/AIAVC_IMGPROTO/requirements.lock.txt),
# thêm torchvision 0.29.1+cu130 (bộ xử lý ảnh của Qwen3-VL). torch và torchvision chỉ lấy từ chỉ mục cu130 tường minh.
[project]
name = "aiavc-imagegen"
version = "0.0.0"
description = "Local illustration sidecar (FLUX 3 Image Klein) for AI Auto Video Creator"
requires-python = "==3.13.15"
dependencies = [
    "accelerate==1.15.0",
    "diffusers==0.42.1",
    "huggingface-hub==1.33.0",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "safetensors==0.8.0",
    "torch==2.14.1+cu130",
    "torchvision==0.29.1+cu130",
    "transformers==5.22.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]
constraint-dependencies = [
    "accelerate==1.15.0",
    "annotated-doc==0.0.5",
    "anyio==4.16.0",
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "colorama==0.4.6",
    "diffusers==0.42.1",
    "filelock==4.2.6",
    "fsspec==2026.9.0",
    "h11==0.16.0",
    "hf-xet==1.8.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.33.0",
    "idna==3.20",
    "importlib-metadata==10.1.0",
    "jinja2==3.1.6",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.4",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "networkx==3.7",
    "numpy==2.5.4",
    "packaging==26.3",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "pygments==2.21.0",
    "pyyaml==6.0.3",
    "regex==2026.9.29",
    "requests==2.34.2",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "setuptools==84.2.1",
    "shellingham==1.5.4",
    "sympy==1.14.0",
    "tokenizers==0.23.3",
    "torch==2.14.1+cu130",
    "torchvision==0.29.1+cu130",
    "tqdm==4.70.1",
    "transformers==5.22.1",
    "typer==0.27.3",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "zipp==4.1.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
