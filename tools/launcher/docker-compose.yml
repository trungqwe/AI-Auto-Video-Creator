# Ngăn xếp Docker cục bộ cho AI Auto Video Creator (ADAPT-LAUNCH)
# Chỉ mở trên loopback 127.0.0.1, hình ảnh ghim theo digest SHA-256 từ tools/runtime/runtime.lock.json

services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: aiavc-postgres
    restart: unless-stopped
    # Pool DB 36 cộng kết nối trực tiếp của launcher/worker và Temporal dùng chung máy chủ; mặc định 100 quá sát (ADAPT-PROD-FIX4). Áp khi launcher tạo lại container.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: controlplane
      POSTGRES_DB: controlplane
      POSTGRES_PASSWORD: "${AIAVC_PG_PASSWORD:?thiếu mật khẩu do launcher cấp}"
    ports:
      - "127.0.0.1:57028:5432"
    volumes:
      - aiavc_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane -d controlplane"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-schema:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    container_name: aiavc-temporal-schema
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: "5432"
      SQL_USER: controlplane
      SQL_PASSWORD: "${AIAVC_PG_PASSWORD:?thiếu mật khẩu do launcher cấp}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        temporal-sql-tool --db temporal create || true;
        temporal-sql-tool --db temporal setup-schema -v 0.0 || true;
        temporal-sql-tool --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned;
        temporal-sql-tool --db temporal_visibility create || true;
        temporal-sql-tool --db temporal_visibility setup-schema -v 0.0 || true;
        temporal-sql-tool --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

  temporal:
    image: temporalio/server:1.31.2@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
    container_name: aiavc-temporal
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: controlplane
      POSTGRES_PWD: "${AIAVC_PG_PASSWORD:?thiếu mật khẩu do launcher cấp}"
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - "./temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro"

volumes:
  aiavc_pgdata:
    name: aiavc_pgdata
